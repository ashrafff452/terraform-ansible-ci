---
# ============================================================
# COMMON LINUX CONFIGURATION
# ============================================================

- name: Configure common settings on all Linux servers
  hosts: all
  become: true
  gather_facts: true

  tasks:

    # --------------------------------------------------------
    # SELINUX - Amazon Linux
    # --------------------------------------------------------

    - name: Disable SELinux immediately on Amazon Linux
      ansible.posix.selinux:
        state: disabled
      when: ansible_os_family == "RedHat"

    # --------------------------------------------------------
    # FIREWALLD - Amazon Linux
    # --------------------------------------------------------

    - name: Stop firewalld on Amazon Linux
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false
      when: ansible_os_family == "RedHat"

      failed_when: false


# ============================================================
# FRONTEND - AMAZON LINUX
# ============================================================

- name: Configure frontend c8.local
  hosts: frontend
  become: true
  gather_facts: true

  tasks:

    - name: Install NGINX
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create NGINX reverse proxy configuration
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/netdata.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://{{ hostvars[groups['backend'][0]]['ansible_host'] }}:19999;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
              }
          }

    - name: Remove default NGINX configuration if present
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Validate NGINX configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test
      changed_when: false

    - name: Start and enable NGINX
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true


# ============================================================
# BACKEND - UBUNTU
# ============================================================

- name: Configure backend u26.local
  hosts: backend
  become: true
  gather_facts: true

  tasks:

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - ca-certificates
        state: present
        update_cache: true

    - name: Download Netdata official kickstart script
      ansible.builtin.get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: '0755'

    - name: Install Netdata from official repository
      ansible.builtin.command:
        cmd: /tmp/netdata-kickstart.sh --non-interactive
      args:
        creates: /usr/sbin/netdata

    - name: Configure Netdata to listen on port 19999
      ansible.builtin.copy:
        dest: /etc/netdata/netdata.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [web]
              default port = 19999
              bind to = 0.0.0.0

    - name: Start and enable Netdata
      ansible.builtin.systemd:
        name: netdata
        state: started
        enabled: true
        daemon_reload: true
