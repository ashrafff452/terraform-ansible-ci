---
- name: Common configuration for all Linux servers
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Disable SELinux on Amazon Linux
      ansible.posix.selinux:
        state: disabled
      when:
        - ansible_facts.os_family == "RedHat"
      register: selinux_result

    - name: Disable firewalld on RedHat based systems
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      when:
        - ansible_facts.os_family == "RedHat"
      failed_when: false


- name: Configure frontend
  hosts: frontend
  become: true
  gather_facts: true

  tasks:

    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Create Nginx configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

  handlers:

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted


- name: Configure backend
  hosts: backend
  become: true
  gather_facts: true

  tasks:

    - name: Install required packages
      ansible.builtin.package:
        name:
          - curl
          - wget
        state: present

    - name: Install Netdata from official repository
      ansible.builtin.shell: |
        wget -qO /tmp/netdata-kickstart.sh https://my-netdata.io/kickstart.sh
        sh /tmp/netdata-kickstart.sh --non-interactive
      args:
        creates: /usr/sbin/netdata

    - name: Configure Netdata to listen on port 19999
      ansible.builtin.lineinfile:
        path: /etc/netdata/netdata.conf
        regexp: '^#?\s*default port ='
        line: '    default port = 19999'
        create: true
      notify: Restart Netdata

    - name: Enable and start Netdata
      ansible.builtin.systemd:
        name: netdata
        state: started
        enabled: true

  handlers:

    - name: Restart Netdata
      ansible.builtin.systemd:
        name: netdata
        state: restarted
